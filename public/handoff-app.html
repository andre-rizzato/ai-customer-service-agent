<!DOCTYPE html>
<!--
  Mini App do atendente (relay de handoff, 05/10/2026) — aberta pelo botão
  "💬 Abrir conversa" do alerta que o TelegramNotifier manda
  (src/handoffNotifier/telegramNotifier.ts). Roda DENTRO do Telegram, que
  entrega à página um `initData` assinado com o token do bot; toda chamada à
  API (/api/handoff/*) manda esse initData no header X-Telegram-Init-Data e o
  servidor confere a assinatura + a allowlist de atendentes
  (src/handoff/telegramInitData.ts). Por isso esta página não tem login: aberta
  fora do Telegram, ou pelo Telegram de quem não é atendente, a API recusa.

  É o caminho "mais completo" do relay — histórico inteiro, caixa de texto,
  devolver ao bot. O caminho principal continua sendo dar "Responder" direto
  no alerta do Telegram (src/handoff/telegramDesk.ts).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Atendimento</title>
<!--
  Script oficial do Telegram que expõe window.Telegram.WebApp (initData,
  tema, botões nativos). Precisa ser carregado ANTES do nosso script, por isso
  sem async/defer.
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /*
    Cores vêm das variáveis que o Telegram injeta (--tg-theme-*), pra página
    seguir o tema claro/escuro do app do atendente sem nenhum código nosso.
    Os valores depois da vírgula são fallback pra quando a página é aberta
    num navegador comum (só pra ver o layout — a API vai recusar mesmo).
  */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #15182a);
    --hint: var(--tg-theme-hint-color, #7a7f8c);
    --link: var(--tg-theme-link-color, #2a7ae2);
    --button: var(--tg-theme-button-color, #15182a);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f3f5);
  }
  * { box-sizing: border-box; }
  /*
    Layout em coluna ocupando a altura toda: cabeçalho fixo em cima, lista de
    mensagens rolando no meio, caixa de resposta fixa embaixo — o mesmo
    esqueleto de qualquer app de chat, que é o que o atendente espera.
    100dvh (e não 100vh) porque no celular o 100vh ignora o teclado aberto e
    a caixa de texto ficaria escondida atrás dele.
  */
  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--secondary-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  header .meta { font-size: 13px; color: var(--hint); }
  /* Selo de estado: verde = com o atendente, cinza = bot respondendo. */
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--secondary-bg); }
  .badge.active { background: #d8f5df; color: #14532d; }
  #messages { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  /*
    Bolhas: cliente à esquerda; bot e atendente à direita (ambos são "a
    empresa" falando), com o atendente destacado na cor do botão pra ficar
    claro o que foi escrito por uma pessoa. Notas internas centralizadas e
    discretas.
  */
  .msg { max-width: 85%; padding: 7px 10px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg .who { display: block; font-size: 11px; color: var(--hint); margin-bottom: 2px; }
  .msg.user { align-self: flex-start; background: var(--secondary-bg); }
  .msg.assistant { align-self: flex-end; background: var(--secondary-bg); opacity: 0.85; }
  .msg.human-agent { align-self: flex-end; background: var(--button); color: var(--button-text); }
  .msg.human-agent .who { color: var(--button-text); opacity: 0.8; }
  .msg.system-note { align-self: center; background: none; color: var(--hint); font-size: 12px; font-style: italic; }
  footer { padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--secondary-bg); display: flex; gap: 8px; }
  textarea {
    flex: 1;
    resize: none;
    min-height: 40px;
    max-height: 120px;
    padding: 9px 12px;
    border-radius: 18px;
    border: 1px solid var(--secondary-bg);
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  button { border: 0; border-radius: 18px; padding: 0 16px; background: var(--button); color: var(--button-text); font: inherit; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: var(--secondary-bg); color: var(--text); font-size: 13px; padding: 6px 12px; }
  #error { color: #b42318; padding: 8px 14px; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <div>
      <div><strong>Atendimento</strong> <span id="badge" class="badge">…</span></div>
      <div class="meta" id="meta">carregando…</div>
    </div>
    <!--
      Encerrar (05/10/2026) avisa o cliente que o atendimento terminou;
      Devolver só passa a conversa de volta pro bot, sem aviso. Os dois só
      aparecem com o atendimento ativo.
    -->
    <div style="display:flex; gap:6px">
      <button id="close-btn" class="secondary" hidden>✅ Encerrar</button>
      <button id="release-btn" class="secondary" hidden>🤖 Devolver ao bot</button>
    </div>
  </header>
  <div id="error" hidden></div>
  <div id="messages"></div>
  <footer>
    <textarea id="input" placeholder="Escreva pro cliente…" maxlength="4000" rows="1"></textarea>
    <button id="send-btn" title="Enviar">Enviar</button>
  </footer>

<script>
(() => {
  // Objeto do Telegram (undefined se aberto num navegador comum). ready()
  // avisa o Telegram que a página carregou (tira o loader nativo); expand()
  // abre o Mini App em altura cheia em vez de meia tela.
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // Id da conversa do cliente, vindo da URL que o TelegramNotifier montou
  // (?c=<id>). Querystring e não fragmento (#) porque o Telegram usa o
  // fragmento pra passar os próprios parâmetros ao Mini App.
  const conversationId = new URLSearchParams(location.search).get("c") || "";
  const api = `/api/handoff/${encodeURIComponent(conversationId)}`;

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const releaseBtn = document.getElementById("release-btn");
  const closeBtn = document.getElementById("close-btn");
  const badgeEl = document.getElementById("badge");
  const metaEl = document.getElementById("meta");
  const errorEl = document.getElementById("error");

  // Rótulos legíveis — mesmo vocabulário do alerta no Telegram.
  const ROLE_LABEL = { user: "Cliente", assistant: "Bot", "human-agent": "Atendente", "system-note": "Nota" };
  const CHANNEL_LABEL = { web: "widget do site", whatsapp: "WhatsApp", telegram: "Telegram" };

  // Quantos turnos já estão desenhados — o refresh periódico só acrescenta
  // os novos em vez de redesenhar tudo (redesenhar faria a lista "piscar" e
  // perder a posição de rolagem enquanto o atendente lê).
  let renderedCount = 0;

  // Preâmbulo: request() é o único lugar que chama a API — sempre com o
  // initData no header (é a autenticação, ver requireAttendant em
  // src/server.ts). Lança Error com a mensagem do servidor em caso de falha,
  // pra quem chamou mostrar algo útil ao atendente.
  async function request(path, options = {}) {
    const res = await fetch(api + path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": tg ? tg.initData : "",
      },
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    return body;
  }

  function showError(message) {
    errorEl.textContent = message;
    errorEl.hidden = !message;
  }

  // Preâmbulo: appendTurn() desenha um turno do histórico. Usa textContent
  // (nunca innerHTML) porque o texto vem do cliente — innerHTML permitiria
  // a um cliente injetar HTML/JS na tela do atendente.
  function appendTurn(turn) {
    const el = document.createElement("div");
    el.className = `msg ${turn.role}`;
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = `${ROLE_LABEL[turn.role] || turn.role} · ${new Date(turn.timestamp).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
    const text = document.createElement("span");
    text.textContent = turn.text;
    el.append(who, text);
    messagesEl.appendChild(el);
  }

  // Preâmbulo: refresh() busca o estado + histórico e atualiza a tela.
  // Chamado na abertura, depois de cada ação, e a cada 4s enquanto a página
  // está visível (pra o atendente ver a resposta do cliente chegando).
  async function refresh() {
    try {
      const data = await request("");
      showError("");
      badgeEl.textContent = data.active ? "com você" : "bot respondendo";
      badgeEl.className = "badge" + (data.active ? " active" : "");
      metaEl.textContent = `Cliente no ${CHANNEL_LABEL[data.channel] || data.channel || "canal desconhecido"}`;
      releaseBtn.hidden = !data.active;
      closeBtn.hidden = !data.active;

      // Só rola pro fim se o atendente já estava no fim — se ele subiu pra
      // reler algo, uma mensagem nova não deve arrancá-lo de lá.
      const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 40;
      for (const turn of data.history.slice(renderedCount)) appendTurn(turn);
      if (data.history.length !== renderedCount && atBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
      renderedCount = data.history.length;
    } catch (err) {
      showError(err.message);
    }
  }

  // Preâmbulo: send() manda o texto da caixa pelo relay
  // (POST /api/handoff/:id/reply). Desabilita o botão durante o envio pra um
  // toque duplo não mandar a mesma mensagem duas vezes ao cliente.
  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    try {
      await request("/reply", { method: "POST", body: JSON.stringify({ text }) });
      inputEl.value = "";
      await refresh();
    } catch (err) {
      showError(`Não enviado: ${err.message}`);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // Preâmbulo: release() devolve a conversa ao bot. Pede confirmação pelo
  // popup NATIVO do Telegram (tg.showConfirm) — não pelo confirm() do
  // navegador, que dentro do Telegram nem sempre aparece.
  function release() {
    const doRelease = async () => {
      try {
        await request("/release", { method: "POST" });
        await refresh();
      } catch (err) {
        showError(err.message);
      }
    };
    if (tg && tg.showConfirm) {
      tg.showConfirm("Devolver a conversa ao bot? Ele volta a responder o cliente sozinho.", (ok) => ok && doRelease());
    } else {
      doRelease();
    }
  }

  sendBtn.addEventListener("click", send);
  releaseBtn.addEventListener("click", release);

  // Preâmbulo: closeConversation() encerra o atendimento
  // (POST /api/handoff/:id/close): o cliente recebe a mensagem de
  // encerramento e o bot volta a responder. Confirmação pelo popup nativo do
  // Telegram, como em release().
  function closeConversation() {
    const doClose = async () => {
      try {
        const result = await request("/close", { method: "POST" });
        // O encerramento acontece mesmo se o aviso não chegar ao cliente
        // (ver HumanRelay.close) — mostra isso em vez de esconder.
        showError(result.delivered === false ? "Encerrado, mas o aviso não chegou ao cliente." : "");
        await refresh();
      } catch (err) {
        showError(err.message);
      }
    };
    if (tg && tg.showConfirm) {
      tg.showConfirm("Encerrar o atendimento? O cliente recebe uma mensagem de encerramento.", (ok) => ok && doClose());
    } else {
      doClose();
    }
  }
  closeBtn.addEventListener("click", closeConversation);
  // Enter envia, Shift+Enter quebra linha — convenção de chat.
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  if (!conversationId) {
    showError("Link sem id de conversa — abra pelo botão do alerta no Telegram.");
    return;
  }
  refresh();
  // Atualização periódica — pausada com a página escondida (Mini App
  // minimizado) pra não fazer requisição à toa.
  setInterval(() => {
    if (!document.hidden) refresh();
  }, 4000);
})();
</script>
</body>
</html>
