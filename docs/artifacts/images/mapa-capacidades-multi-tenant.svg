<svg viewBox="0 0 1120 560" role="img" aria-label="Diagrama mostrando o tráfego de múltiplos domínios de clientes chegando num Nginx único, que roteia por subdomínio para containers Docker separados por cliente numa VM compartilhada, cada container usando sua própria User-Assigned Managed Identity para ler seu próprio Key Vault, isolado dos demais clientes."><rect x="0" y="0" width="1120" height="560" fill="#F3F6FA" />
        <defs>
          <marker id="arrowFlow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
          </marker>
          <marker id="arrowSecret3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#B5701E" />
          </marker>
        </defs>

        <g stroke="#9FB0C8" stroke-width="1">
          <path d="M30,10 v14 M23,17 h14" />
          <path d="M1090,10 v14 M1083,17 h14" />
          <path d="M30,536 v14 M23,543 h14" />
          <path d="M1090,536 v14 M1083,543 h14" />
        </g>

        <!-- channels -->
        <rect x="300" y="20" width="520" height="50" rx="6" fill="#FFFFFF" stroke="#9FB0C8" />
        <text x="560" y="40" text-anchor="middle" font-size="12.5" font-weight="600" fill="#152138" font-family="IBM Plex Mono, monospace">Telegram / WhatsApp / Web</text>
        <text x="560" y="57" text-anchor="middle" font-size="10" fill="#58698A" font-family="IBM Plex Mono, monospace">múltiplos domínios — cliente-x…, cliente-y…</text>

        <line x1="560" y1="70" x2="560" y2="98" stroke="#1C5FCC" stroke-width="2" marker-end="url(#arrowFlow3)" color="#1C5FCC" />

        <!-- nginx -->
        <rect x="300" y="100" width="520" height="50" rx="6" fill="#E7ECF3" stroke="#9FB0C8" />
        <text x="560" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#152138" font-family="IBM Plex Mono, monospace">Nginx (1x)</text>
        <text x="560" y="137" text-anchor="middle" font-size="10" fill="#58698A" font-family="IBM Plex Mono, monospace">roteia por Host header / subdomínio</text>

        <g stroke="#1C5FCC" stroke-width="2" fill="none" color="#1C5FCC">
          <line x1="430" y1="150" x2="290" y2="188" marker-end="url(#arrowFlow3)" />
          <line x1="690" y1="150" x2="830" y2="188" marker-end="url(#arrowFlow3)" />
        </g>

        <!-- VM boundary -->
        <rect x="40" y="190" width="1040" height="240" rx="8" fill="none" stroke="#58698A" stroke-width="1.5" stroke-dasharray="5 4" />
        <text x="60" y="212" font-size="10.5" font-weight="600" letter-spacing="0.05em" fill="#58698A" font-family="IBM Plex Mono, monospace">VM COMPARTILHADA (HOST ÚNICO)</text>

        <!-- stack cliente-x -->
        <rect x="80" y="220" width="460" height="170" rx="6" fill="#FFFFFF" stroke="#C7D2E0" stroke-dasharray="4 3" />
        <text x="100" y="242" font-size="12" font-weight="700" fill="#152138" font-family="IBM Plex Mono, monospace">cliente-x</text>
        <text x="100" y="257" font-size="9.5" fill="#58698A" font-family="IBM Plex Mono, monospace">AZURE_CLIENT_ID = id-cliente-x</text>

        <rect x="100" y="270" width="190" height="70" rx="5" fill="#E7ECF3" stroke="#9FB0C8" />
        <text x="195" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#152138" font-family="IBM Plex Mono, monospace">agente-node</text>
        <text x="195" y="317" text-anchor="middle" font-size="9" fill="#58698A" font-family="IBM Plex Mono, monospace">canal · RAG · orchestrator</text>

        <rect x="320" y="270" width="190" height="70" rx="5" fill="#E7ECF3" stroke="#9FB0C8" />
        <text x="415" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#152138" font-family="IBM Plex Mono, monospace">agent-service</text>
        <text x="415" y="317" text-anchor="middle" font-size="9" fill="#58698A" font-family="IBM Plex Mono, monospace">Python · connectors</text>

        <line x1="290" y1="305" x2="318" y2="305" stroke="#1C5FCC" stroke-width="1.75" marker-end="url(#arrowFlow3)" color="#1C5FCC" />

        <!-- stack cliente-y -->
        <rect x="580" y="220" width="460" height="170" rx="6" fill="#FFFFFF" stroke="#C7D2E0" stroke-dasharray="4 3" />
        <text x="600" y="242" font-size="12" font-weight="700" fill="#152138" font-family="IBM Plex Mono, monospace">cliente-y</text>
        <text x="600" y="257" font-size="9.5" fill="#58698A" font-family="IBM Plex Mono, monospace">AZURE_CLIENT_ID = id-cliente-y</text>

        <rect x="600" y="270" width="190" height="70" rx="5" fill="#E7ECF3" stroke="#9FB0C8" />
        <text x="695" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#152138" font-family="IBM Plex Mono, monospace">agente-node</text>
        <text x="695" y="317" text-anchor="middle" font-size="9" fill="#58698A" font-family="IBM Plex Mono, monospace">canal · RAG · orchestrator</text>

        <rect x="820" y="270" width="190" height="70" rx="5" fill="#E7ECF3" stroke="#9FB0C8" />
        <text x="915" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#152138" font-family="IBM Plex Mono, monospace">agent-service</text>
        <text x="915" y="317" text-anchor="middle" font-size="9" fill="#58698A" font-family="IBM Plex Mono, monospace">Python · connectors</text>

        <line x1="790" y1="305" x2="818" y2="305" stroke="#1C5FCC" stroke-width="1.75" marker-end="url(#arrowFlow3)" color="#1C5FCC" />

        <!-- key vaults -->
        <rect x="295" y="460" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#B5701E" stroke-width="1.5" />
        <text x="415" y="485" text-anchor="middle" font-size="11.5" font-weight="700" fill="#152138" font-family="IBM Plex Mono, monospace">kv-cliente-x</text>
        <text x="415" y="502" text-anchor="middle" font-size="9.5" fill="#58698A" font-family="IBM Plex Mono, monospace">Key Vault</text>

        <rect x="795" y="460" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#B5701E" stroke-width="1.5" />
        <text x="915" y="485" text-anchor="middle" font-size="11.5" font-weight="700" fill="#152138" font-family="IBM Plex Mono, monospace">kv-cliente-y</text>
        <text x="915" y="502" text-anchor="middle" font-size="9.5" fill="#58698A" font-family="IBM Plex Mono, monospace">Key Vault</text>

        <line x1="415" y1="340" x2="415" y2="458" stroke="#B5701E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowSecret3)" />
        <text x="427" y="415" font-size="9" fill="#58698A" font-family="IBM Plex Mono, monospace">User-Assigned</text>
        <text x="427" y="427" font-size="9" fill="#58698A" font-family="IBM Plex Mono, monospace">Managed Identity</text>

        <line x1="915" y1="340" x2="915" y2="458" stroke="#B5701E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowSecret3)" />
        <text x="927" y="415" font-size="9" fill="#58698A" font-family="IBM Plex Mono, monospace">User-Assigned</text>
        <text x="927" y="427" font-size="9" fill="#58698A" font-family="IBM Plex Mono, monospace">Managed Identity</text>
      </svg>